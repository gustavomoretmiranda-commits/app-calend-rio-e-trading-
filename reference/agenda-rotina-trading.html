<style>
  #agenda-root {
    --bg: #12181b;
    --surface: #1b2226;
    --surface-2: #222b2f;
    --border: #2e383c;
    --text: #ece8df;
    --text-muted: #8a9499;
    --accent: #4fa3a0;
    --accent-2: #c97b4a;
    --accent-3: #8e7ccc;
    --accent-4: #d8b85c;
    --accent-5: #6e9bc7;
    --profit: #4fbf7f;
    --loss: #e1685b;
    --radius: 10px;
    --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;

    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    border-radius: 14px;
    padding: 20px;
    box-sizing: border-box;
    min-height: 100%;
  }
  #agenda-root * { box-sizing: border-box; }
  #agenda-root h1, #agenda-root h2, #agenda-root h3 { font-family: var(--font-mono); font-weight: 600; margin: 0; letter-spacing: 0.2px; }
  #agenda-root .top {
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
    margin-bottom: 16px;
  }
  #agenda-root .top h1 { font-size: 18px; color: var(--text); }
  #agenda-root .save-note { font-size: 11px; color: var(--text-muted); font-family: var(--font-mono); }
  #agenda-root .tabs { display: flex; gap: 6px; margin-bottom: 18px; border-bottom: 1px solid var(--border); }
  #agenda-root .tab-btn {
    background: transparent; border: none; color: var(--text-muted); font-family: var(--font-mono);
    font-size: 13px; padding: 10px 14px; cursor: pointer; border-bottom: 2px solid transparent; transition: all .15s;
  }
  #agenda-root .tab-btn:hover { color: var(--text); }
  #agenda-root .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
  #agenda-root .panel { display: none; }
  #agenda-root .panel.active { display: block; }

  #agenda-root .cal-nav { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  #agenda-root .cal-nav button {
    background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; width: 28px; height: 28px; cursor: pointer; font-family: var(--font-mono);
  }
  #agenda-root .cal-nav button:hover { border-color: var(--accent); color: var(--accent); }
  #agenda-root .cal-nav .month-label { font-family: var(--font-mono); font-size: 14px; min-width: 150px; text-align: center; text-transform: capitalize; }

  #agenda-root .legend { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  #agenda-root .legend-item {
    display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text-muted);
    background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 4px 9px;
  }
  #agenda-root .legend-item.is-highlight { border-color: var(--accent-4); color: var(--text); }
  #agenda-root .star { cursor: pointer; color: var(--accent-4); font-size: 12px; line-height: 1; }
  #agenda-root .star:hover { filter: brightness(1.3); }
  #agenda-root .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
  #agenda-root .dot-highlight { width: 10px; height: 10px; box-shadow: 0 0 0 2px var(--surface), 0 0 0 3px var(--accent-4); }
  #agenda-root .tag-x { cursor: pointer; opacity: 0.5; margin-left: 2px; font-size: 10px; }
  #agenda-root .tag-x:hover { opacity: 1; color: var(--loss); }
  #agenda-root .tag-add-form { display: flex; gap: 6px; margin-bottom: 16px; max-width: 380px; }
  #agenda-root .tag-add-form input { flex: 1; }

  #agenda-root .grid7 { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
  #agenda-root .weekday-head { text-align: center; font-size: 10px; color: var(--text-muted); font-family: var(--font-mono); padding: 4px 0 8px; text-transform: uppercase; letter-spacing: 1px; }
  #agenda-root .day-cell {
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    min-height: 74px; padding: 6px; cursor: pointer; position: relative; transition: border-color .12s;
  }
  #agenda-root .day-cell:hover { border-color: var(--accent); }
  #agenda-root .day-cell.empty { background: transparent; border-color: transparent; cursor: default; }
  #agenda-root .day-cell.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  #agenda-root .day-cell.today .day-num { color: var(--accent); font-weight: 700; }
  #agenda-root .day-num { font-family: var(--font-mono); font-size: 12px; color: var(--text-muted); }
  #agenda-root .day-tags { display: flex; gap: 3px; margin-top: 4px; flex-wrap: wrap; }
  #agenda-root .day-ev-preview { font-size: 9.5px; color: var(--text-muted); margin-top: 3px; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  #agenda-root .editor {
    margin-top: 16px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px;
  }
  #agenda-root .editor-title { font-family: var(--font-mono); font-size: 13px; margin-bottom: 10px; text-transform: capitalize; }
  #agenda-root .tag-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  #agenda-root .tag-chip {
    display: flex; align-items: center; gap: 5px; padding: 5px 10px; border-radius: 20px; border: 1px solid var(--border);
    background: var(--surface-2); color: var(--text-muted); font-size: 11.5px; cursor: pointer; transition: all .12s;
  }
  #agenda-root .tag-chip.active { color: var(--bg); border-color: transparent; }
  #agenda-root .ev-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
  #agenda-root .ev-item {
    display: flex; align-items: center; gap: 8px; background: var(--surface-2); border-radius: 6px; padding: 6px 10px; font-size: 12.5px;
  }
  #agenda-root .ev-item .ev-time { font-family: var(--font-mono); color: var(--accent-4); min-width: 42px; }
  #agenda-root .ev-item .ev-label { flex: 1; }
  #agenda-root .ev-item .del { cursor: pointer; color: var(--text-muted); background: none; border: none; font-size: 14px; }
  #agenda-root .ev-item .del:hover { color: var(--loss); }
  #agenda-root .add-form { display: flex; gap: 6px; }
  #agenda-root input[type="text"], #agenda-root input[type="time"], #agenda-root input[type="number"], #agenda-root select {
    background: var(--surface-2); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 7px 9px; font-size: 12.5px; font-family: var(--font-body);
  }
  #agenda-root select { width: 100%; }
  #agenda-root input[type="time"] { font-family: var(--font-mono); width: 90px; }
  #agenda-root input[type="text"] { flex: 1; }
  #agenda-root .btn {
    background: var(--accent); color: #0d1213; border: none; border-radius: 6px; padding: 7px 14px; font-size: 12.5px; cursor: pointer; font-weight: 600;
  }
  #agenda-root .btn:hover { filter: brightness(1.1); }
  #agenda-root .btn.ghost { background: transparent; border: 1px solid var(--border); color: var(--text-muted); }
  #agenda-root .empty-msg { color: var(--text-muted); font-size: 12.5px; padding: 20px 0; text-align: center; }

  #agenda-root .week-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; align-items: start; }
  #agenda-root .week-col { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px; }
  #agenda-root .week-col-head { font-family: var(--font-mono); font-size: 12px; text-align: center; padding-bottom: 8px; margin-bottom: 10px; border-bottom: 1px solid var(--border); }
  #agenda-root .week-period { margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px dashed var(--border); }
  #agenda-root .week-period:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }
  #agenda-root .week-period-label { font-family: var(--font-mono); font-size: 10px; color: var(--accent-5); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 6px; }
  #agenda-root .week-block {
    background: var(--surface-2); border-radius: 6px; padding: 6px 8px; margin-bottom: 6px; font-size: 11.5px; position: relative;
  }
  #agenda-root .week-block .t { font-family: var(--font-mono); color: var(--accent-5); display: block; }
  #agenda-root .week-block .del { position: absolute; top: 4px; right: 6px; background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 12px; }
  #agenda-root .week-block .del:hover { color: var(--loss); }
  #agenda-root .week-add { display: flex; flex-direction: column; gap: 5px; margin-top: 8px; }
  #agenda-root .week-add input { width: 100%; }

  #agenda-root .acct-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
  #agenda-root .acct-chip {
    display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 20px; border: 1px solid var(--border);
    background: var(--surface); cursor: pointer; font-size: 12.5px; color: var(--text-muted);
  }
  #agenda-root .acct-chip.active { border-color: var(--accent); color: var(--text); }
  #agenda-root .acct-chip .x { margin-left: 4px; opacity: 0.6; }
  #agenda-root .acct-chip .x:hover { opacity: 1; color: var(--loss); }
  #agenda-root .acct-add-form { display: flex; gap: 6px; align-items: center; }

  #agenda-root .stats-row { display: flex; gap: 14px; margin-bottom: 14px; flex-wrap: wrap; }
  #agenda-root .stat { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 10px 16px; }
  #agenda-root .stat .label { font-size: 10.5px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
  #agenda-root .stat .val { font-family: var(--font-mono); font-size: 16px; margin-top: 3px; }

  #agenda-root .trade-cell { min-height: 62px; display: flex; flex-direction: column; justify-content: space-between; }
  #agenda-root .trade-val { font-family: var(--font-mono); font-size: 11px; margin-top: auto; font-weight: 600; }
  #agenda-root .trade-input-wrap input { width: 100%; margin-top: 4px; }

  @media (max-width: 720px) {
    #agenda-root .week-grid { grid-template-columns: 1fr 1fr; }
    #agenda-root .day-cell { min-height: 56px; }
    #agenda-root .day-ev-preview { display: none; }
  }
</style>

<div id="agenda-root">
  <div class="top">
    <h1>／ Rotina &amp; Trading</h1>
    <div class="save-note" id="save-note">carregando…</div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="main">Calendário principal</button>
    <button class="tab-btn" data-tab="week">Rotina semanal</button>
    <button class="tab-btn" data-tab="trade">Trading</button>
  </div>

  <div class="panel active" id="panel-main"></div>
  <div class="panel" id="panel-week"></div>
  <div class="panel" id="panel-trade"></div>
</div>

<script>
(function () {
  const root = document.getElementById("agenda-root");

  const PALETTE = ["#4fa3a0", "#c97b4a", "#8e7ccc", "#d8b85c", "#6e9bc7", "#c77ba0", "#5fb0d9", "#b98cd9", "#7bbf6a", "#d97b9e"];

  const DEFAULT_TAGS = [
    { key: "corrida", label: "Corrida", color: "#4fa3a0", highlight: true },
    { key: "academia", label: "Academia", color: "#c97b4a", highlight: true },
    { key: "estudo", label: "Estudo", color: "#8e7ccc", highlight: false },
    { key: "evento", label: "Evento", color: "#d8b85c", highlight: false },
    { key: "tarefa", label: "Tarefa", color: "#6e9bc7", highlight: false },
    { key: "mercado", label: "Mercado", color: "#c77ba0", highlight: true },
  ];

  const PERIODS = [
    { key: "manha", label: "Manhã" },
    { key: "tarde", label: "Tarde" },
    { key: "noite", label: "Noite" },
  ];

  const WEEK_DAYS = [
    { key: "seg", label: "Segunda" },
    { key: "ter", label: "Terça" },
    { key: "qua", label: "Quarta" },
    { key: "qui", label: "Quinta" },
    { key: "sex", label: "Sexta" },
    { key: "sab", label: "Sábado" },
    { key: "dom", label: "Domingo" },
  ];

  const MONTH_NAMES = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
  const WEEKDAY_HEAD = ["dom","seg","ter","qua","qui","sex","sáb"];
  const ACCT_COLORS = ["#4fa3a0", "#c97b4a", "#8e7ccc", "#d8b85c", "#6e9bc7", "#c77ba0"];

  let state = {
    tags: {},      // 'YYYY-MM-DD' -> [tagKey,...]
    events: {},    // 'YYYY-MM-DD' -> [{id,time,label}]
    weekly: { seg: [], ter: [], qua: [], qui: [], sex: [], sab: [], dom: [] },
    accounts: [],  // {id,name,color}
    entries: {},   // accountId -> { 'YYYY-MM-DD': number }
    tagConfig: [], // [{key,label,color}]
  };

  let mainCal = { y: new Date().getFullYear(), m: new Date().getMonth(), selected: null };
  let tradeCal = { y: new Date().getFullYear(), m: new Date().getMonth() };
  let activeAccountId = null;
  let editingCell = null; // date key currently showing a number input in trade tab

  function pad(n) { return String(n).padStart(2, "0"); }
  function dateKey(y, m, d) { return `${y}-${pad(m + 1)}-${pad(d)}`; }
  function todayKey() { const t = new Date(); return dateKey(t.getFullYear(), t.getMonth(), t.getDate()); }
  function daysInMonth(y, m) { return new Date(y, m + 1, 0).getDate(); }
  function firstWeekday(y, m) { return new Date(y, m, 1).getDay(); }
  function fmtBRL(v) {
    const sign = v < 0 ? "-" : v > 0 ? "+" : "";
    return sign + "R$ " + Math.abs(v).toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }

  let saveTimeout = null;
  function setSaveNote(text) { document.getElementById("save-note").textContent = text; }
  async function persist(key, value) {
    try {
      await window.storage.set(key, JSON.stringify(value), false);
      setSaveNote("salvo");
    } catch (e) {
      setSaveNote("erro ao salvar");
      console.error(e);
    }
  }
  function scheduleSave(key, value) {
    setSaveNote("salvando…");
    clearTimeout(saveTimeout);
    saveTimeout = setTimeout(() => persist(key, value), 250);
  }

  async function loadKey(key, fallback) {
    try {
      const r = await window.storage.get(key, false);
      return r ? JSON.parse(r.value) : fallback;
    } catch (e) {
      return fallback;
    }
  }

  async function loadAll() {
    state.tags = await loadKey("routine-tags", {});
    state.events = await loadKey("routine-events", {});
    state.weekly = await loadKey("weekly-schedule", { seg: [], ter: [], qua: [], qui: [], sex: [], sab: [], dom: [] });
    state.accounts = await loadKey("trading-accounts", []);
    state.entries = await loadKey("trading-entries", {});
    state.tagConfig = await loadKey("tag-config", DEFAULT_TAGS);
    if (state.accounts.length && !activeAccountId) activeAccountId = state.accounts[0].id;
    setSaveNote("tudo salvo");
    renderAll();
  }

  // ---------- TABS ----------
  root.querySelectorAll(".tab-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      root.querySelectorAll(".tab-btn").forEach((b) => b.classList.remove("active"));
      root.querySelectorAll(".panel").forEach((p) => p.classList.remove("active"));
      btn.classList.add("active");
      document.getElementById("panel-" + btn.dataset.tab).classList.add("active");
    });
  });

  function renderAll() {
    renderMainCalendar();
    renderWeekly();
    renderTrading();
  }

  // ---------- MAIN CALENDAR ----------
  function renderMainCalendar() {
    const panel = document.getElementById("panel-main");
    const y = mainCal.y, m = mainCal.m;
    const nDays = daysInMonth(y, m);
    const offset = firstWeekday(y, m);
    const tKey = todayKey();

    let cells = "";
    for (let i = 0; i < offset; i++) cells += `<div class="day-cell empty"></div>`;
    for (let d = 1; d <= nDays; d++) {
      const key = dateKey(y, m, d);
      const isToday = key === tKey;
      const isSel = key === mainCal.selected;
      const dayTags = state.tags[key] || [];
      const dayEvents = state.events[key] || [];
      const sortedDayTags = dayTags.slice().sort((a, b) => {
        const ca = state.tagConfig.find((c) => c.key === a);
        const cb = state.tagConfig.find((c) => c.key === b);
        return (cb?.highlight ? 1 : 0) - (ca?.highlight ? 1 : 0);
      });
      const dotsHtml = sortedDayTags.map((tk) => {
        const cfg = state.tagConfig.find((c) => c.key === tk);
        if (!cfg) return "";
        return `<span class="dot ${cfg.highlight ? "dot-highlight" : ""}" style="background:${cfg.color}" title="${escapeHtml(cfg.label)}"></span>`;
      }).join("");
      const previewHtml = dayEvents.length
        ? `<div class="day-ev-preview">${escapeHtml(dayEvents[0].label)}${dayEvents.length > 1 ? " +" + (dayEvents.length - 1) : ""}</div>`
        : "";
      cells += `<div class="day-cell ${isToday ? "today" : ""} ${isSel ? "selected" : ""}" data-date="${key}">
        <div class="day-num">${d}</div>
        <div class="day-tags">${dotsHtml}</div>
        ${previewHtml}
      </div>`;
    }

    const legend = state.tagConfig.map((cfg) => `
      <div class="legend-item ${cfg.highlight ? "is-highlight" : ""}">
        <span class="star" data-toggle-highlight="${cfg.key}" title="Destacar como principal">${cfg.highlight ? "★" : "☆"}</span>
        <span class="dot" style="background:${cfg.color}"></span>${escapeHtml(cfg.label)}
        <span class="tag-x" data-del-tag="${cfg.key}" title="Remover atividade">✕</span>
      </div>`).join("");

    panel.innerHTML = `
      <div class="cal-nav">
        <button id="main-prev">‹</button>
        <div class="month-label">${MONTH_NAMES[m]} ${y}</div>
        <button id="main-next">›</button>
      </div>
      <div class="legend">${legend}</div>
      <div class="tag-add-form">
        <input type="text" id="new-tag-name" placeholder="Nova tag (ex: Leitura, Igreja...)" />
        <button class="btn ghost" id="add-tag-btn">+ Adicionar tag</button>
      </div>
      <div class="grid7">
        <div class="weekday-head">${WEEKDAY_HEAD.join('</div><div class="weekday-head">')}</div>
        ${cells}
      </div>
      <div id="day-editor"></div>
    `;

    panel.querySelector("#main-prev").addEventListener("click", () => { shiftMonth(-1); });
    panel.querySelector("#main-next").addEventListener("click", () => { shiftMonth(1); });
    panel.querySelector("#add-tag-btn").addEventListener("click", addTagConfig);
    panel.querySelector("#new-tag-name").addEventListener("keydown", (e) => { if (e.key === "Enter") addTagConfig(); });
    panel.querySelectorAll("[data-del-tag]").forEach((x) => {
      x.addEventListener("click", (e) => {
        e.stopPropagation();
        removeTagConfig(x.dataset.delTag);
      });
    });
    panel.querySelectorAll("[data-toggle-highlight]").forEach((star) => {
      star.addEventListener("click", (e) => {
        e.stopPropagation();
        toggleHighlight(star.dataset.toggleHighlight);
      });
    });
    panel.querySelectorAll(".day-cell[data-date]").forEach((cell) => {
      cell.addEventListener("click", () => {
        mainCal.selected = mainCal.selected === cell.dataset.date ? null : cell.dataset.date;
        renderMainCalendar();
      });
    });

    if (mainCal.selected) renderDayEditor(mainCal.selected);
  }

  function slugify(str) {
    return str.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
  }

  function addTagConfig() {
    const input = document.getElementById("new-tag-name");
    const label = input.value.trim();
    if (!label) return;
    let key = slugify(label) || "tag";
    let suffix = 1;
    while (state.tagConfig.some((c) => c.key === key)) { key = slugify(label) + "-" + suffix; suffix++; }
    const color = PALETTE[state.tagConfig.length % PALETTE.length];
    state.tagConfig.push({ key, label, color, highlight: false });
    scheduleSave("tag-config", state.tagConfig);
    renderMainCalendar();
    renderWeekly();
  }

  function toggleHighlight(key) {
    const cfg = state.tagConfig.find((c) => c.key === key);
    if (!cfg) return;
    cfg.highlight = !cfg.highlight;
    scheduleSave("tag-config", state.tagConfig);
    renderMainCalendar();
  }

  function removeTagConfig(key) {
    const cfg = state.tagConfig.find((c) => c.key === key);
    if (!cfg) return;
    if (!confirm(`Remover a atividade "${cfg.label}"? Ela será removida do calendário e da rotina semanal.`)) return;
    state.tagConfig = state.tagConfig.filter((c) => c.key !== key);
    Object.keys(state.tags).forEach((dateKeyStr) => {
      state.tags[dateKeyStr] = state.tags[dateKeyStr].filter((t) => t !== key);
      if (state.tags[dateKeyStr].length === 0) delete state.tags[dateKeyStr];
    });
    Object.keys(state.weekly).forEach((dayKey) => {
      state.weekly[dayKey] = state.weekly[dayKey].filter((b) => b.tagKey !== key);
    });
    scheduleSave("tag-config", state.tagConfig);
    scheduleSave("routine-tags", state.tags);
    scheduleSave("weekly-schedule", state.weekly);
    renderMainCalendar();
    renderWeekly();
  }

  function shiftMonth(delta) {
    mainCal.m += delta;
    if (mainCal.m < 0) { mainCal.m = 11; mainCal.y--; }
    if (mainCal.m > 11) { mainCal.m = 0; mainCal.y++; }
    mainCal.selected = null;
    renderMainCalendar();
  }

  function renderDayEditor(key) {
    const wrap = document.getElementById("day-editor");
    const [y, m, d] = key.split("-");
    const dateObj = new Date(Number(y), Number(m) - 1, Number(d));
    const dateLabel = dateObj.toLocaleDateString("pt-BR", { weekday: "long", day: "numeric", month: "long" });
    const activeTags = state.tags[key] || [];
    const events = state.events[key] || [];

    const tagChips = state.tagConfig.length
      ? state.tagConfig.map((cfg) => {
          const isActive = activeTags.includes(cfg.key);
          return `<div class="tag-chip ${isActive ? "active" : ""}" data-tag="${cfg.key}" style="${isActive ? `background:${cfg.color}` : ""}">${escapeHtml(cfg.label)}</div>`;
        }).join("")
      : '<div class="empty-msg" style="padding:4px 0;text-align:left;">Nenhuma tag criada. Adicione uma acima do calendário.</div>';

    const evList = events.map((ev) => `
      <div class="ev-item">
        <span class="ev-time">${ev.time || "--:--"}</span>
        <span class="ev-label">${escapeHtml(ev.label)}</span>
        <button class="del" data-del-event="${ev.id}">✕</button>
      </div>`).join("");

    wrap.innerHTML = `
      <div class="editor">
        <div class="editor-title">${dateLabel}</div>
        <div class="tag-row">${tagChips}</div>
        <div class="ev-list">${evList || '<div class="empty-msg" style="padding:6px 0;text-align:left;">Nenhum evento adicionado ainda.</div>'}</div>
        <div class="add-form">
          <input type="time" id="new-ev-time" />
          <input type="text" id="new-ev-label" placeholder="Ex: Estudar edital, dentista, mercado..." />
          <button class="btn" id="add-ev-btn">Adicionar</button>
        </div>
      </div>
    `;

    wrap.querySelectorAll("[data-tag]").forEach((chip) => {
      chip.addEventListener("click", () => {
        const tag = chip.dataset.tag;
        const cur = state.tags[key] || [];
        state.tags[key] = cur.includes(tag) ? cur.filter((t) => t !== tag) : [...cur, tag];
        if (state.tags[key].length === 0) delete state.tags[key];
        scheduleSave("routine-tags", state.tags);
        renderMainCalendar();
      });
    });
    wrap.querySelectorAll("[data-del-event]").forEach((btn) => {
      btn.addEventListener("click", () => {
        state.events[key] = (state.events[key] || []).filter((e) => e.id !== btn.dataset.delEvent);
        if (state.events[key].length === 0) delete state.events[key];
        scheduleSave("routine-events", state.events);
        renderMainCalendar();
      });
    });
    wrap.querySelector("#add-ev-btn").addEventListener("click", () => addEvent(key));
    wrap.querySelector("#new-ev-label").addEventListener("keydown", (e) => { if (e.key === "Enter") addEvent(key); });
  }

  function addEvent(key) {
    const timeInput = document.getElementById("new-ev-time");
    const labelInput = document.getElementById("new-ev-label");
    const label = labelInput.value.trim();
    if (!label) return;
    if (!state.events[key]) state.events[key] = [];
    state.events[key].push({ id: String(Date.now()), time: timeInput.value, label });
    state.events[key].sort((a, b) => (a.time || "99:99").localeCompare(b.time || "99:99"));
    scheduleSave("routine-events", state.events);
    renderMainCalendar();
  }

  // ---------- WEEKLY ROUTINE ----------
  function renderWeekly() {
    const panel = document.getElementById("panel-week");

    if (state.tagConfig.length === 0) {
      document.getElementById("panel-week").innerHTML =
        `<div class="empty-msg">Crie atividades na aba "Calendário principal" primeiro — elas aparecerão aqui como opções para montar sua rotina.</div>`;
      return;
    }

    const options = `<option value="">Selecione...</option>` +
      state.tagConfig.map((cfg) => `<option value="${cfg.key}">${escapeHtml(cfg.label)}</option>`).join("");

    const cols = WEEK_DAYS.map(({ key, label }) => {
      const periodsHtml = PERIODS.map((p) => {
        const blocks = (state.weekly[key] || [])
          .filter((b) => (b.period || "manha") === p.key)
          .slice()
          .sort((a, b) => a.start.localeCompare(b.start));
        const comboKey = `${key}::${p.key}`;
        const blocksHtml = blocks.map((b) => {
          const cfg = state.tagConfig.find((c) => c.key === b.tagKey);
          const color = cfg ? cfg.color : "#666";
          const activityLabel = cfg ? cfg.label : "(atividade removida)";
          return `
          <div class="week-block" style="border-left: 3px solid ${color}">
            <button class="del" data-week-del="${key}::${b.id}">✕</button>
            <span class="t">${b.start}</span>${escapeHtml(activityLabel)}
          </div>`;
        }).join("") || '<div class="empty-msg" style="padding:2px 0;font-size:10.5px;">Vazio</div>';

        return `
          <div class="week-period">
            <div class="week-period-label">${p.label}</div>
            <div class="week-blocks">${blocksHtml}</div>
            <div class="week-add">
              <input type="time" data-week-time="${comboKey}" />
              <select data-week-activity="${comboKey}">${options}</select>
              <button class="btn ghost" data-week-add="${comboKey}">+ Adicionar</button>
            </div>
          </div>`;
      }).join("");

      return `
        <div class="week-col">
          <div class="week-col-head">${label}</div>
          ${periodsHtml}
        </div>`;
    }).join("");

    panel.innerHTML = `<div class="week-grid">${cols}</div>`;

    panel.querySelectorAll("[data-week-add]").forEach((btn) => {
      btn.addEventListener("click", () => addWeekBlock(btn.dataset.weekAdd));
    });
    panel.querySelectorAll("[data-week-del]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const [dayKey, id] = btn.dataset.weekDel.split("::");
        state.weekly[dayKey] = state.weekly[dayKey].filter((b) => b.id !== id);
        scheduleSave("weekly-schedule", state.weekly);
        renderWeekly();
      });
    });
  }

  function addWeekBlock(comboKey) {
    const [dayKey, periodKey] = comboKey.split("::");
    const timeInput = document.querySelector(`[data-week-time="${comboKey}"]`);
    const selectInput = document.querySelector(`[data-week-activity="${comboKey}"]`);
    const tagKey = selectInput.value;
    if (!tagKey) return;
    const start = timeInput.value || "00:00";
    if (!state.weekly[dayKey]) state.weekly[dayKey] = [];
    state.weekly[dayKey].push({ id: String(Date.now()), start, tagKey, period: periodKey });
    scheduleSave("weekly-schedule", state.weekly);
    renderWeekly();
  }

  // ---------- TRADING ----------
  function renderTrading() {
    const panel = document.getElementById("panel-trade");

    const chips = state.accounts.map((acc) => `
      <div class="acct-chip ${acc.id === activeAccountId ? "active" : ""}" data-acct="${acc.id}">
        <span class="dot" style="background:${acc.color}"></span>${escapeHtml(acc.name)}
        <span class="x" data-del-acct="${acc.id}">✕</span>
      </div>`).join("");

    panel.innerHTML = `
      <div class="acct-row">
        ${chips}
        <div class="acct-add-form">
          <input type="text" id="new-acct-name" placeholder="Nome da conta (ex: Conta FTMO)" />
          <button class="btn" id="add-acct-btn">+ Nova conta</button>
        </div>
      </div>
      <div id="trade-body"></div>
    `;

    panel.querySelectorAll("[data-acct]").forEach((chip) => {
      chip.addEventListener("click", (e) => {
        if (e.target.dataset.delAcct) return;
        activeAccountId = chip.dataset.acct;
        renderTrading();
      });
    });
    panel.querySelectorAll("[data-del-acct]").forEach((x) => {
      x.addEventListener("click", (e) => {
        e.stopPropagation();
        const id = x.dataset.delAcct;
        if (!confirm("Remover esta conta e todos os valores registrados nela?")) return;
        state.accounts = state.accounts.filter((a) => a.id !== id);
        delete state.entries[id];
        if (activeAccountId === id) activeAccountId = state.accounts[0]?.id || null;
        scheduleSave("trading-accounts", state.accounts);
        scheduleSave("trading-entries", state.entries);
        renderTrading();
      });
    });
    panel.querySelector("#add-acct-btn").addEventListener("click", addAccount);
    panel.querySelector("#new-acct-name").addEventListener("keydown", (e) => { if (e.key === "Enter") addAccount(); });

    renderTradeBody();
  }

  function addAccount() {
    const input = document.getElementById("new-acct-name");
    const name = input.value.trim();
    if (!name) return;
    const color = ACCT_COLORS[state.accounts.length % ACCT_COLORS.length];
    const acc = { id: String(Date.now()), name, color };
    state.accounts.push(acc);
    state.entries[acc.id] = {};
    activeAccountId = acc.id;
    scheduleSave("trading-accounts", state.accounts);
    scheduleSave("trading-entries", state.entries);
    renderTrading();
  }

  function renderTradeBody() {
    const body = document.getElementById("trade-body");
    if (!activeAccountId) {
      body.innerHTML = `<div class="empty-msg">Crie uma conta acima para começar a registrar seus dias de trading.</div>`;
      return;
    }
    const acc = state.accounts.find((a) => a.id === activeAccountId);
    if (!acc) { body.innerHTML = ""; return; }
    const entries = state.entries[acc.id] || {};

    const y = tradeCal.y, m = tradeCal.m;
    const nDays = daysInMonth(y, m);
    const offset = firstWeekday(y, m);
    const tKey = todayKey();

    let monthTotal = 0, posCount = 0, negCount = 0;
    Object.entries(entries).forEach(([k, v]) => {
      const [ky, km] = k.split("-").map(Number);
      if (ky === y && km - 1 === m) {
        monthTotal += v;
        if (v > 0) posCount++;
        if (v < 0) negCount++;
      }
    });
    const maxAbs = Math.max(1, ...Object.entries(entries)
      .filter(([k]) => { const [ky, km] = k.split("-").map(Number); return ky === y && km - 1 === m; })
      .map(([, v]) => Math.abs(v)));

    let cells = "";
    for (let i = 0; i < offset; i++) cells += `<div class="day-cell empty"></div>`;
    for (let d = 1; d <= nDays; d++) {
      const key = dateKey(y, m, d);
      const val = entries[key];
      const isToday = key === tKey;
      let bg = "";
      let valHtml = "";
      if (typeof val === "number" && val !== 0) {
        const intensity = 0.15 + 0.55 * (Math.abs(val) / maxAbs);
        bg = val > 0
          ? `background: rgba(79,191,127,${intensity.toFixed(2)});`
          : `background: rgba(225,104,91,${intensity.toFixed(2)});`;
        valHtml = `<div class="trade-val" style="color:${val > 0 ? "var(--profit)" : "var(--loss)"}">${fmtBRL(val)}</div>`;
      }
      const showInput = editingCell === key;
      const inputHtml = showInput
        ? `<div class="trade-input-wrap"><input type="number" step="0.01" id="trade-input-${key}" value="${val || ""}" placeholder="0,00" /></div>`
        : "";
      cells += `<div class="day-cell trade-cell ${isToday ? "today" : ""}" data-trade-date="${key}" style="${bg}">
        <div class="day-num">${d}</div>
        ${inputHtml}
        ${!showInput ? valHtml : ""}
      </div>`;
    }

    body.innerHTML = `
      <div class="cal-nav">
        <button id="trade-prev">‹</button>
        <div class="month-label">${MONTH_NAMES[m]} ${y}</div>
        <button id="trade-next">›</button>
      </div>
      <div class="stats-row">
        <div class="stat"><div class="label">Resultado do mês</div><div class="val" style="color:${monthTotal >= 0 ? "var(--profit)" : "var(--loss)"}">${fmtBRL(monthTotal)}</div></div>
        <div class="stat"><div class="label">Dias positivos</div><div class="val" style="color:var(--profit)">${posCount}</div></div>
        <div class="stat"><div class="label">Dias negativos</div><div class="val" style="color:var(--loss)">${negCount}</div></div>
      </div>
      <div class="grid7">
        <div class="weekday-head">${WEEKDAY_HEAD.join('</div><div class="weekday-head">')}</div>
        ${cells}
      </div>
    `;

    body.querySelector("#trade-prev").addEventListener("click", () => { shiftTradeMonth(-1); });
    body.querySelector("#trade-next").addEventListener("click", () => { shiftTradeMonth(1); });

    body.querySelectorAll("[data-trade-date]").forEach((cell) => {
      cell.addEventListener("click", (e) => {
        if (e.target.tagName === "INPUT") return;
        editingCell = cell.dataset.tradeDate;
        renderTradeBody();
        const inp = document.getElementById("trade-input-" + editingCell);
        if (inp) { inp.focus(); inp.select(); }
      });
    });

    if (editingCell) {
      const inp = document.getElementById("trade-input-" + editingCell);
      if (inp) {
        const commit = () => {
          const key = editingCell;
          const raw = inp.value.trim().replace(",", ".");
          const num = parseFloat(raw);
          if (!state.entries[acc.id]) state.entries[acc.id] = {};
          if (raw === "" || isNaN(num)) delete state.entries[acc.id][key];
          else state.entries[acc.id][key] = num;
          editingCell = null;
          scheduleSave("trading-entries", state.entries);
          renderTradeBody();
        };
        inp.addEventListener("keydown", (e) => { if (e.key === "Enter") commit(); if (e.key === "Escape") { editingCell = null; renderTradeBody(); } });
        inp.addEventListener("blur", commit);
      }
    }
  }

  function shiftTradeMonth(delta) {
    tradeCal.m += delta;
    if (tradeCal.m < 0) { tradeCal.m = 11; tradeCal.y--; }
    if (tradeCal.m > 11) { tradeCal.m = 0; tradeCal.y++; }
    editingCell = null;
    renderTradeBody();
  }

  loadAll();
})();
</script>
